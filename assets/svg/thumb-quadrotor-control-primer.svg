.s{animation:spin 7s linear infinite;transform-origin:120px 88px} @keyframes spin{to{transform:rotate(360deg)}}
.t{animation:tilt 7s ease-in-out infinite;transform-origin:252px 118px} @keyframes tilt{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(26deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
