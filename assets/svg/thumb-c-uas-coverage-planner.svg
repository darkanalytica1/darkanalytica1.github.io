<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Sensor coverage rings with a line-of-sight shadow and dead zone">
<title>Sensor coverage rings with a line-of-sight shadow and dead zone</title>
<style>
text{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:9px;fill:#62686F}
.f{animation:flow 3s linear infinite} @keyframes flow{to{stroke-dashoffset:-24}}
.p{animation:pulse 4s ease-in-out infinite} @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.s{animation:sweep 6s linear infinite;transform-origin:160px 90px} @keyframes sweep{to{transform:rotate(360deg)}}
.g{animation:grow 5s ease-in-out infinite;transform-box:fill-box;transform-origin:left bottom} @keyframes grow{0%{transform:scaleX(.2)}50%,100%{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="320" height="180" fill="#FBFAF7"/>
<g stroke="#ECE9E2" stroke-width="1"><path d="M20 0V180"/><path d="M40 0V180"/><path d="M60 0V180"/><path d="M80 0V180"/><path d="M100 0V180"/><path d="M120 0V180"/><path d="M140 0V180"/><path d="M160 0V180"/><path d="M180 0V180"/><path d="M200 0V180"/><path d="M220 0V180"/><path d="M240 0V180"/><path d="M260 0V180"/><path d="M280 0V180"/><path d="M300 0V180"/><path d="M0 20H320"/><path d="M0 40H320"/><path d="M0 60H320"/><path d="M0 80H320"/><path d="M0 100H320"/><path d="M0 120H320"/><path d="M0 140H320"/><path d="M0 160H320"/></g>

<path d="M160 90 L236 52 L262 96 Z" fill="#F6EFDF" stroke="#B8872B" stroke-dasharray="3 3"/>
<rect x="194" y="66" width="16" height="22" rx="2" fill="#fff" stroke="#5B7083" stroke-width="1.5"/>
<circle cx="160" cy="90" r="70" fill="#E8EDF3" fill-opacity=".45" stroke="#1F3A5F" stroke-width="1.5" stroke-dasharray="4 4" class="f"/>
<circle cx="112" cy="112" r="44" fill="none" stroke="#5B7083" stroke-width="1.5"/>
<circle cx="160" cy="90" r="4" fill="#1F3A5F"/><circle cx="112" cy="112" r="3.5" fill="#5B7083"/>
<g class="s"><path d="M160 90 L160 20" stroke="#1F3A5F" stroke-width="1.5" opacity=".5"/></g>
<path id="t1" d="M300 30 C260 50 240 80 225 90 C200 100 180 96 166 92" fill="none" stroke="none"/><circle r="3.2" fill="#A33A2B"><animateMotion dur="5s" begin="0s" repeatCount="indefinite"><mpath href="#t1"/></animateMotion></circle>
<text x="232" y="118" fill="#B8872B">dead zone</text><text x="12" y="170">coverage · overlap · LOS</text></svg>
