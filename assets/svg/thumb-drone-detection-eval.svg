<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A drone drawn at shrinking apparent size with recall bars per size bin">
<title>A drone drawn at shrinking apparent size with recall bars per size bin</title>
<style>
text{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:9px;fill:#5F6B7C}
.p{animation:pulse 3.2s ease-in-out infinite} @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.g{animation:grow 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom} @keyframes grow{0%{transform:scaleY(.25)}55%,100%{transform:scaleY(1)}}
.f{animation:flow 3s linear infinite} @keyframes flow{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="320" height="180" fill="#F5F7FA"/>
<g stroke="#E7EBF0" stroke-width="1"><path d="M40 0V180"/><path d="M80 0V180"/><path d="M120 0V180"/><path d="M160 0V180"/><path d="M200 0V180"/><path d="M240 0V180"/><path d="M280 0V180"/><path d="M0 40H320"/><path d="M0 80H320"/><path d="M0 120H320"/></g>

<polygon points="34,60 300,28 300,92 34,60" fill="#EDF1F6"/>
<path d="M34 60 L300 28 M34 60 L300 92" stroke="#B9C4D2" stroke-width="1" stroke-dasharray="4 4" class="f"/>
<rect x="10" y="50" width="20" height="18" rx="3" fill="#fff" stroke="#0B2545" stroke-width="1.5"/>
<circle cx="20" cy="59" r="4" fill="none" stroke="#0B2545" stroke-width="1.5"/>

<rect x="76" y="46" width="28" height="28" fill="none" stroke="#0B2545" stroke-width="1.5"/>
<rect x="152" y="53" width="14" height="14" fill="none" stroke="#0B2545" stroke-width="1.5"/>
<rect x="212" y="56" width="7" height="7" fill="none" stroke="#8A6A1F" stroke-width="1.5"/>
<rect x="262" y="58" width="4" height="4" fill="none" stroke="#8A6A1F" stroke-width="1.5" class="p"/>
<circle cx="264" cy="60" r="11" fill="none" stroke="#8A6A1F" stroke-width="1" stroke-dasharray="3 3" class="p"/>

<path d="M20 148 H300" stroke="#D8DEE6"/>
<g class="g">
  <rect x="36"  y="134" width="30" height="14" fill="#8A6A1F"/>
  <rect x="106" y="116" width="30" height="32" fill="#8A6A1F" fill-opacity=".62"/>
  <rect x="176" y="110" width="30" height="38" fill="#0B2545" fill-opacity=".82"/>
  <rect x="246" y="108" width="30" height="40" fill="#0B2545"/>
</g>
<text x="34" y="128" fill="#8A6A1F">0.34</text><text x="174" y="104">0.93</text>
<text x="20" y="166">0–8 px · 8–16 · 16–32 · 32–64 px</text>
<text x="300" y="166" text-anchor="end" fill="#8A6A1F">900 alarms/h</text>
<text x="20" y="20">recall by apparent size</text></svg>
