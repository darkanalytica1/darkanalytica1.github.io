<title>Each technique paired with the defence that stops it</title>
<style>
text{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:9px;fill:#5F6B7D}
.f{animation:flow 3s linear infinite} @keyframes flow{to{stroke-dashoffset:-24}}
