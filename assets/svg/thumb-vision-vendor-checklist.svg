<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="An evidence ladder from claim to independent verification, with a gate line">
<title>An evidence ladder from claim to independent verification, with a gate line</title>
<style>
text{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:9px;fill:#5F6B7C}
.f{animation:flow 3s linear infinite} @keyframes flow{to{stroke-dashoffset:-24}}
.g{animation:grow 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom} @keyframes grow{0%{transform:scaleY(.3)}55%,100%{transform:scaleY(1)}}
.p{animation:pulse 3.4s ease-in-out infinite} @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="320" height="180" fill="#F5F7FA"/>
<g stroke="#E7EBF0" stroke-width="1"><path d="M40 0V180"/><path d="M80 0V180"/><path d="M120 0V180"/><path d="M160 0V180"/><path d="M200 0V180"/><path d="M240 0V180"/><path d="M280 0V180"/><path d="M0 40H320"/><path d="M0 80H320"/><path d="M0 120H320"/></g>

<g class="g">
  <rect x="20"  y="126" width="46" height="22" fill="#fff" stroke="#D8DEE6"/>
  <rect x="76"  y="106" width="46" height="42" fill="#F4EFE2" stroke="#8A6A1F"/>
  <rect x="132" y="86"  width="46" height="62" fill="#F4EFE2" stroke="#8A6A1F"/>
  <rect x="188" y="66"  width="46" height="82" fill="#EDF1F6" stroke="#3E5C76"/>
  <rect x="244" y="46"  width="46" height="102" fill="#0B2545"/>
</g>
<path d="M76 100 H300" stroke="#8A6A1F" stroke-width="1.2" stroke-dasharray="5 3" class="f"/>
<text x="230" y="96" fill="#8A6A1F" class="p">gate minimum</text>
<path d="M20 148 H300" stroke="#D8DEE6"/>
<g fill="#5F6B7C" font-size="8">
  <text x="22" y="160">claim</text><text x="78" y="160">document</text><text x="134" y="160">demo</text>
  <text x="190" y="160">reproduced</text><text x="246" y="160">independent</text></g>
<text x="20" y="20">23 questions · 8 gates</text>
<text x="300" y="20" text-anchor="end" fill="#8A6A1F">evidence, graded</text></svg>
