<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Decision timeline where the C2 queue dominates latency">
<title>Decision timeline where the C2 queue dominates latency</title>
<style>
text{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:9px;fill:#62686F}
.f{animation:flow 3s linear infinite} @keyframes flow{to{stroke-dashoffset:-24}}
.p{animation:pulse 4s ease-in-out infinite} @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.s{animation:sweep 6s linear infinite;transform-origin:0px 0px} @keyframes sweep{to{transform:rotate(360deg)}}
.g{animation:grow 5s ease-in-out infinite;transform-box:fill-box;transform-origin:left bottom} @keyframes grow{0%{transform:scaleX(.2)}50%,100%{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="320" height="180" fill="#FBFAF7"/>
<g stroke="#ECE9E2" stroke-width="1"><path d="M20 0V180"/><path d="M40 0V180"/><path d="M60 0V180"/><path d="M80 0V180"/><path d="M100 0V180"/><path d="M120 0V180"/><path d="M140 0V180"/><path d="M160 0V180"/><path d="M180 0V180"/><path d="M200 0V180"/><path d="M220 0V180"/><path d="M240 0V180"/><path d="M260 0V180"/><path d="M280 0V180"/><path d="M300 0V180"/><path d="M0 20H320"/><path d="M0 40H320"/><path d="M0 60H320"/><path d="M0 80H320"/><path d="M0 100H320"/><path d="M0 120H320"/><path d="M0 140H320"/><path d="M0 160H320"/></g>
<rect x="30" y="70" width="50" height="30" fill="#fff" stroke="#5B7083" stroke-width="1.6"/><text x="55.0" y="89" text-anchor="middle">sense</text><rect x="80" y="70" width="40" height="30" fill="#fff" stroke="#5B7083" stroke-width="1.6"/><text x="100.0" y="89" text-anchor="middle">fuse</text><rect x="120" y="70" width="70" height="30" fill="#fff" stroke="#A33A2B" stroke-width="1.6"/><text x="155.0" y="89" text-anchor="middle">C2</text><rect x="190" y="70" width="40" height="30" fill="#fff" stroke="#1F3A5F" stroke-width="1.6"/><text x="210.0" y="89" text-anchor="middle">decide</text><rect x="230" y="70" width="60" height="30" fill="#fff" stroke="#5E7F68" stroke-width="1.6"/><text x="260.0" y="89" text-anchor="middle">act</text>
<path d="M30 124H290" stroke="#62686F" stroke-width="1.2"/>
<rect x="120" y="70" width="70" height="30" fill="#F6E9E6" opacity=".7" class="p"/>
<path id="c1" d="M30 124H290" fill="none" stroke="none"/><circle r="3.2" fill="#1F3A5F"><animateMotion dur="5s" begin="0s" repeatCount="indefinite"><mpath href="#c1"/></animateMotion></circle>
<text x="30" y="142">t0</text><text x="266" y="142">effect</text>
<text x="116" y="56" fill="#A33A2B">queue + handoff</text></svg>
