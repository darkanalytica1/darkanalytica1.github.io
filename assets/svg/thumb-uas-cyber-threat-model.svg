<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="UAS system blocks with links as attack surfaces">
<title>UAS system blocks with links as attack surfaces</title>
<style>
text{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:9px;fill:#5F6B7C}
.f{animation:flow 3s linear infinite} @keyframes flow{to{stroke-dashoffset:-24}}
.p{animation:pulse 4s ease-in-out infinite} @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.s{animation:sweep 6s linear infinite;transform-origin:0px 0px} @keyframes sweep{to{transform:rotate(360deg)}}
.g{animation:grow 5s ease-in-out infinite;transform-box:fill-box;transform-origin:left bottom} @keyframes grow{0%{transform:scaleX(.2)}50%,100%{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="320" height="180" fill="#F5F7FA"/>
<g stroke="#E7EBF0" stroke-width="1"><path d="M20 0V180"/><path d="M40 0V180"/><path d="M60 0V180"/><path d="M80 0V180"/><path d="M100 0V180"/><path d="M120 0V180"/><path d="M140 0V180"/><path d="M160 0V180"/><path d="M180 0V180"/><path d="M200 0V180"/><path d="M220 0V180"/><path d="M240 0V180"/><path d="M260 0V180"/><path d="M280 0V180"/><path d="M300 0V180"/><path d="M0 20H320"/><path d="M0 40H320"/><path d="M0 60H320"/><path d="M0 80H320"/><path d="M0 100H320"/><path d="M0 120H320"/><path d="M0 140H320"/><path d="M0 160H320"/></g>

<rect x="26" y="35" width="68" height="30" rx="4" fill="#fff" stroke="#0B2545" stroke-width="1.5"/><text x="60" y="53" text-anchor="middle">GCS</text><rect x="226" y="35" width="68" height="30" rx="4" fill="#fff" stroke="#0B2545" stroke-width="1.5"/><text x="260" y="53" text-anchor="middle">aircraft</text><rect x="26" y="117" width="68" height="30" rx="4" fill="#fff" stroke="#0B2545" stroke-width="1.5"/><text x="60" y="135" text-anchor="middle">cloud</text><rect x="226" y="117" width="68" height="30" rx="4" fill="#fff" stroke="#0B2545" stroke-width="1.5"/><text x="260" y="135" text-anchor="middle">payload</text>
<path d="M94 50H226" stroke="#3E5C76" stroke-width="1.5" stroke-dasharray="4 4" class="f"/>
<path d="M60 65V117" stroke="#3E5C76" stroke-width="1.5" stroke-dasharray="4 4" class="f"/>
<path d="M260 65V117" stroke="#3E5C76" stroke-width="1.5"/>
<circle cx="160" cy="50" r="9" fill="#F4EFE2" stroke="#8A6A1F" stroke-width="1.5" class="p"/><text x="140" y="80" fill="#8A6A1F">C2 link</text>
<circle cx="60" cy="91" r="7" fill="#F8F0E1" stroke="#B7791F" stroke-width="1.5" class="p"/>
<text x="118" y="170">STRIDE per interface</text></svg>
