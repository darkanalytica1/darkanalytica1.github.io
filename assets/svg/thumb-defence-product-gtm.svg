<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Five-role buyer map around a requirement">
<title>Five-role buyer map around a requirement</title>
<style>
text{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:9px;fill:#62686F}
.f{animation:flow 3s linear infinite} @keyframes flow{to{stroke-dashoffset:-24}}
.p{animation:pulse 4s ease-in-out infinite} @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.s{animation:sweep 6s linear infinite;transform-origin:0px 0px} @keyframes sweep{to{transform:rotate(360deg)}}
.g{animation:grow 5s ease-in-out infinite;transform-box:fill-box;transform-origin:left bottom} @keyframes grow{0%{transform:scaleX(.2)}50%,100%{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="320" height="180" fill="#FBFAF7"/>
<g stroke="#ECE9E2" stroke-width="1"><path d="M20 0V180"/><path d="M40 0V180"/><path d="M60 0V180"/><path d="M80 0V180"/><path d="M100 0V180"/><path d="M120 0V180"/><path d="M140 0V180"/><path d="M160 0V180"/><path d="M180 0V180"/><path d="M200 0V180"/><path d="M220 0V180"/><path d="M240 0V180"/><path d="M260 0V180"/><path d="M280 0V180"/><path d="M300 0V180"/><path d="M0 20H320"/><path d="M0 40H320"/><path d="M0 60H320"/><path d="M0 80H320"/><path d="M0 100H320"/><path d="M0 120H320"/><path d="M0 140H320"/><path d="M0 160H320"/></g>
<path d="M160 90 L60 50" stroke="#5B7083" stroke-width="1.5" stroke-dasharray="4 4" class="f"/><path d="M160 90 L60 130" stroke="#5B7083" stroke-width="1.5" stroke-dasharray="4 4" class="f"/><path d="M160 90 L260 50" stroke="#5B7083" stroke-width="1.5" stroke-dasharray="4 4" class="f"/><path d="M160 90 L260 130" stroke="#5B7083" stroke-width="1.5" stroke-dasharray="4 4" class="f"/><rect x="30" y="37" width="60" height="26" rx="4" fill="#fff" stroke="#5B7083" stroke-width="1.5"/><text x="60" y="53" text-anchor="middle">user</text><rect x="30" y="117" width="60" height="26" rx="4" fill="#fff" stroke="#5B7083" stroke-width="1.5"/><text x="60" y="133" text-anchor="middle">buyer</text><rect x="130" y="77" width="60" height="26" rx="4" fill="#fff" stroke="#1F3A5F" stroke-width="2"/><text x="160" y="93" text-anchor="middle">req.</text><rect x="230" y="37" width="60" height="26" rx="4" fill="#fff" stroke="#5B7083" stroke-width="1.5"/><text x="260" y="53" text-anchor="middle">test</text><rect x="230" y="117" width="60" height="26" rx="4" fill="#fff" stroke="#5B7083" stroke-width="1.5"/><text x="260" y="133" text-anchor="middle">sustain</text><path id="b1" d="M60 130 L160 90 L260 50" fill="none" stroke="none"/><circle r="3.2" fill="#A33A2B"><animateMotion dur="4s" begin="0s" repeatCount="indefinite"><mpath href="#b1"/></animateMotion></circle><text x="12" y="172">decided upstream of the tender</text></svg>
